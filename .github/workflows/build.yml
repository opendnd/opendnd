# ~~ Generated by projen. To modify, edit .projenrc.js and run "bunx projen".

name: build
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v1
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
      - name: Install dependencies
        run: bun install
      - name: Synthesize project
        run: bun run .projenrc.ts
      - name: Build
        run: bunx projen build
      - name: Test
        run: bunx projen test
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.xml"
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Turbo cache
        uses: actions/cache@v4
        if: always()
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
